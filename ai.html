<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <title>AI Support | 0K3A</title>
    <style>
        :root {
            --ikea-blue: #0051ba;
            --ikea-yellow: #ffda1a;
            --ikea-dark: #111111;
            --ikea-gray: #f5f5f5;
            --ikea-border: #dfdfdf;

            --text-color: #111111;
            --container-bg: #ffffff;
            --body-bg: #0051ba;
            /* Signature Brand Blue */
            --sidebar-bg: #ffda1a;
            /* Amplified Brand Yellow Sidebar */
            --msg-ai-bg: #f5f5f5;
            --msg-ai-text: #111111;
            --msg-user-bg: #0051ba;
            --msg-user-text: #ffffff;
            --border-accent: #0051ba;
        }

        [data-theme="dark"] {
            --text-color: #ffffff;
            --container-bg: #111111;
            /* Showroom Dark Core */
            --body-bg: #002d66;
            /* Deep Dark Navy */
            --sidebar-bg: #1a1a1a;
            --ikea-border: #333333;
            --msg-ai-bg: #2a2a2a;
            --msg-ai-text: #ffffff;
            --msg-user-bg: #ffda1a;
            /* High-Visibility Yellow user bubbles */
            --msg-user-text: #111111;
            --border-accent: #ffda1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--body-bg);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
            padding: 20px;
        }

        /* Base Structural Layout - Flat-pack Dashboard Panel */
        .wrapper {
            width: 100%;
            max-width: 1100px;
            height: calc(100vh - 40px);
            background: var(--container-bg);
            border-radius: 6px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            overflow: hidden;
            border: 4px solid var(--ikea-yellow);
            /* Bold Framing Border */
        }

        [data-theme="dark"] .wrapper {
            border-color: #1a1a1a;
        }

        /* Sidebar Menu Layout - "Product Catalog History" */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-right: 3px solid var(--ikea-blue);
            display: flex;
            flex-direction: column;
            padding: 20px;
            flex-shrink: 0;
            transition: background-color 0.3s, border-color 0.3s;
        }

        [data-theme="dark"] .sidebar {
            border-right-color: var(--ikea-border);
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .sidebar-title {
            font-size: 0.85rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--ikea-blue);
        }

        [data-theme="dark"] .sidebar-title {
            color: var(--ikea-yellow);
        }

        /* Rounded elements flattened into structural block buttons */
        .action-btn {
            background: var(--ikea-blue);
            color: #ffffff;
            border: none;
            padding: 12px 16px;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: background-color 0.15s, color 0.15s;
        }

        [data-theme="dark"] .action-btn {
            background: var(--ikea-yellow);
            color: var(--ikea-dark);
        }

        .action-btn:hover {
            background: var(--ikea-dark);
            color: #ffffff;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .history-item {
            padding: 12px;
            background: #ffffff;
            color: var(--ikea-dark);
            border: 2px solid var(--ikea-blue);
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background-color 0.15s, border-color 0.15s, color 0.15s;
        }

        [data-theme="dark"] .history-item {
            background: #2a2a2a;
            color: #ffffff;
            border-color: transparent;
        }

        .history-item:hover {
            background: var(--ikea-blue);
            color: #ffffff;
            border-color: var(--ikea-blue);
        }

        [data-theme="dark"] .history-item:hover {
            background: var(--ikea-yellow);
            color: var(--ikea-dark);
        }

        /* Theme Selector Bar */
        .bottom-controls {
            border-top: 2px solid rgba(0, 81, 186, 0.15);
            padding-top: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        [data-theme="dark"] .bottom-controls {
            border-top-color: var(--ikea-border);
        }

        .theme-label {
            font-size: 0.75rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--ikea-blue);
        }

        [data-theme="dark"] .theme-label {
            color: #ffffff;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.15);
            transition: .2s;
            border-radius: 22px;
        }

        [data-theme="dark"] .slider {
            background-color: var(--ikea-border);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: #ffffff;
            transition: .2s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--ikea-blue);
        }

        [data-theme="dark"] input:checked+.slider {
            background-color: var(--ikea-yellow);
        }

        input:checked+.slider:before {
            transform: translateX(22px);
            background-color: var(--ikea-yellow);
        }

        [data-theme="dark"] input:checked+.slider:before {
            background-color: var(--ikea-dark);
        }

        /* Chat Window / Conversation Workspace */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--container-bg);
        }

        .chat-header {
            padding: 20px 25px;
            border-bottom: 2px solid var(--ikea-gray);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
        }

        [data-theme="dark"] .chat-header {
            background: #111111;
            border-bottom-color: var(--ikea-border);
        }

        .chat-header h2 {
            font-size: 1.3rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            color: var(--ikea-blue);
        }

        [data-theme="dark"] .chat-header h2 {
            color: #ffffff;
        }

        .home-link {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--ikea-blue);
            text-decoration: none;
            text-transform: uppercase;
            border: 2px solid var(--ikea-blue);
            padding: 6px 12px;
            border-radius: 4px;
            transition: background-color 0.15s, color 0.15s;
        }

        [data-theme="dark"] .home-link {
            color: var(--ikea-yellow);
            border-color: var(--ikea-yellow);
        }

        .home-link:hover {
            background-color: var(--ikea-blue);
            color: #ffffff;
        }

        [data-theme="dark"] .home-link:hover {
            background-color: var(--ikea-yellow);
            color: var(--ikea-dark);
        }

        /* Message Stage Content Container */
        .stage {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: var(--container-bg);
        }

        .msg {
            max-width: 75%;
            padding: 14px 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            border-radius: 4px;
            word-wrap: break-word;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        /* AI Component Box style */
        .ai-msg {
            background-color: var(--msg-ai-bg);
            color: var(--msg-ai-text);
            align-self: flex-start;
            border-left: 5px solid var(--ikea-blue);
            font-weight: 500;
        }

        [data-theme="dark"] .ai-msg {
            border-left-color: var(--ikea-yellow);
        }

        /* User Message layout */
        .user-msg {
            background-color: var(--msg-user-bg);
            color: var(--msg-user-text);
            align-self: flex-end;
            font-weight: 600;
        }

        /* Form Input Bar layout */
        .input-area {
            padding: 20px 25px;
            border-top: 2px solid var(--ikea-gray);
            display: flex;
            gap: 12px;
            background: #ffffff;
        }

        [data-theme="dark"] .input-area {
            background: #111111;
            border-top-color: var(--ikea-border);
        }

        .input-area input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid var(--ikea-border);
            border-radius: 4px;
            font-size: 0.95rem;
            background: var(--ikea-gray);
            color: var(--text-color);
            outline: none;
            transition: border-color 0.15s, background-color 0.15s;
            font-weight: 500;
        }

        .input-area input:focus {
            border-color: var(--border-accent);
            background: var(--container-bg);
        }

        .send-btn {
            background: var(--ikea-blue);
            color: #ffffff;
            border: none;
            width: 50px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: background-color 0.15s, color 0.15s;
        }

        [data-theme="dark"] .send-btn {
            background: var(--ikea-yellow);
            color: var(--ikea-dark);
        }

        .send-btn:hover {
            background: var(--ikea-dark);
            color: #ffffff;
        }

        [data-theme="dark"] .send-btn:hover {
            background: #ffffff;
            color: var(--ikea-dark);
        }

        /* System Clear Option */
        .clear-btn {
            background: none;
            border: none;
            color: #cc3333;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: left;
            padding: 6px;
            width: max-content;
        }

        [data-theme="dark"] .clear-btn {
            color: #ff6666;
        }

        .clear-btn:hover {
            text-decoration: underline;
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            body {
                padding: 0;
            }

            .wrapper {
                height: 100vh;
                border-radius: 0;
                border: none;
            }

            .sidebar {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="wrapper">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">Sessions Vault</div>
            </div>

            <button class="action-btn" onclick="startNewChat()">
                <i class="ri-add-line"></i> New Session
            </button>

            <div class="history-list" id="history"></div>

            <button class="clear-btn" onclick="clearAllChats()">
                <i class="ri-delete-bin-line"></i> Clear All History
            </button>

            <div class="bottom-controls">
                <span class="theme-label">Dark Mode</span>
                <label class="switch">
                    <input type="checkbox" id="theme-toggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="main-chat">
            <div class="chat-header">
                <h2>AI Co-Worker Console</h2>
                <a href="/index.html" class="home-link">Exit to Dashboard</a>
            </div>

            <div class="stage" id="stage">
                <div class="msg ai-msg">Welcome to the support kiosk. How can I assist you today?</div>
            </div>

            <div class="input-area">
                <input type="text" id="user-input" placeholder="Type your instruction or message here..." autocomplete="off" />
                <button class="send-btn" onclick="send()">
                    <i class="ri-send-plane-2-line"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Core Chat Processing Logic
        const stage = document.getElementById('stage');
        const userInput = document.getElementById('user-input');
        const historyList = document.getElementById('history');

        let chats = JSON.parse(localStorage.getItem('0k3a_pro_vault')) || {};
        let chatId = Date.now();

        function updateHistory() {
            historyList.innerHTML = '';
            Object.keys(chats).sort((a, b) => b - a).forEach(id => {
                const div = document.createElement('div');
                div.className = 'history-item';
                const firstMsg = chats[id][0]?.content || "Empty Session";
                div.textContent = firstMsg.substring(0, 25) + (firstMsg.length > 25 ? '...' : '');
                div.onclick = () => loadChat(id);
                historyList.appendChild(div);
            });
        }

        async function send() {
            const text = userInput.value.trim();
            if (!text) return;

            if (!chats[chatId]) chats[chatId] = [];
            chats[chatId].push({
                role: 'user',
                content: text
            });

            // 1. Render User Bubble
            const uDiv = document.createElement('div');
            uDiv.className = 'msg user-msg';
            uDiv.textContent = text;
            stage.appendChild(uDiv);

            userInput.value = '';
            stage.scrollTop = stage.scrollHeight;

            // 2. Create Temporary Loading Bubble for the AI response
            const aiDiv = document.createElement('div');
            aiDiv.className = 'msg ai-msg';
            aiDiv.textContent = "Connecting to showroom assistance...";
            stage.appendChild(aiDiv);
            stage.scrollTop = stage.scrollHeight;

            try {
                // 3. Directly fetch from Pollinations Text Endpoint (No API Key Required)
                const response = await fetch('https://text.pollinations.ai/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        messages: [{
                                role: 'system',
                                content: 'You are a helpful AI customer service kiosk assistant'
                            },
                            {
                                role: 'user',
                                content: text
                            }
                        ],
                        model: 'openai' // Options include: 'openai', 'mistral', 'qwen', etc.
                    })
                });

                if (!response.ok) throw new Error('Network component failure');

                const reply = await response.text();

                // 4. Update Loading Bubble with the Live Streamed Text Response
                aiDiv.textContent = reply;

                // 5. Commit Session to LocalStorage Vault
                chats[chatId].push({
                    role: 'ai',
                    content: reply
                });
                localStorage.setItem('0k3a_pro_vault', JSON.stringify(chats));

            } catch (error) {
                // Fallback layout state if the network goes down
                aiDiv.textContent = "Error: Out of stock. Could not connect to the remote service engine.";
                console.error(error);
            }

            stage.scrollTop = stage.scrollHeight;
            updateHistory();
        }

        function clearAllChats() {
            if (confirm("Wipe all chat history?")) {
                chats = {};
                localStorage.removeItem('0k3a_pro_vault');
                updateHistory();
                startNewChat();
            }
        }

        function loadChat(id) {
            chatId = id;
            stage.innerHTML = '';
            chats[id].forEach(m => {
                const div = document.createElement('div');
                div.className = `msg ${m.role}-msg`;
                div.textContent = m.content;
                stage.appendChild(div);
            });
            stage.scrollTop = stage.scrollHeight;
        }

        function startNewChat() {
            chatId = Date.now();
            stage.innerHTML = '<div class=\"msg ai-msg\">New support session active. Ready to assist.</div>';
            updateHistory();
        }

        userInput.onkeypress = (e) => {
            if (e.key === 'Enter') send();
        };

        // Theme Switch Component
        const toggle = document.getElementById('theme-toggle');
        toggle.onchange = () => {
            const t = toggle.checked ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
            localStorage.setItem('theme', t);
        };

        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            toggle.checked = true;
        }

        updateHistory();
    </script>
</body>

</html>
